color:#947029;background:#fff5db;padding:6px 10px;border-radius:20px}.upload-demo{border:2px dashed #8bbebc;border-radius:18px;text-align:center;padding:20px;margin:18px 0;background:#f2fbfa;font-size:20px}.upload-demo p{font-size:13px}.questions{padding-right:22px}.questions li{padding:13px 2px;border-bottom:1px solid #e6edef}.screen{animation:enter .45s ease}@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\u003c/style>\u003cheader>\u003ca class=\"brand\" href=\"#home\">Buy\u003cspan>Test\u003c/span>\u003c/a>\u003csmall>תצוגה מקדימה\u003c/small>\u003c/header>\u003cmain class=\"page\">\u003csection id=\"home\">\u003cdiv class=\"hero\">\u003cdiv class=\"opening-heading\">\u003ch1>עומד לקנות רכב יד שנייה?\u003cbr>\u003cspan class=\"tagline\">BuyTest — זו הכתובת הנכונה בשבילך.\u003c/span>\u003c/h1>\u003c/div>\u003cdiv class=\"photo\">\u003cimg src=\"amos-buytest-opening.png\" alt=\"עמוס רוקח עם טאבלט לצד רכב במכון בדיקה\">\u003c/div>\u003cdiv class=\"copy\">\u003cdiv class=\"eyebrow\">לפני הקנייה · אחרי בדיקת המכון\u003c/div>\u003cp class=\"trust\">\u003cstrong>עמוס רוקח\u003c/strong>\u003cbr>15 שנות ניסיון בבדיקות קנייה\u003cbr>\u003csmall>הנדסאי רכב · מנהל מוסך מוסמך · בוחן רישוי\u003c/small>\u003c/p>\u003cdiv class=\"service-grid\">\u003cbutton class=\"cta\" data-screen=\"before\">\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"M4 20v-7l4-7h16l4 7v7M4 13h24M7 20v5M25 20v5M4 20h24M8 16h4M20 16h4\"/>\u003c/svg>\u003cspan>\u003cstrong>בדיקת רכב\u003c/strong>\u003csmall>נתונים ותובנות · בחינם\u003c/small>\u003c/span>\u003c/button>\u003cbutton class=\"cta navy\" data-screen=\"report\">\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"M7 3h13l6 6v20H7zM19 3v8h7M11 16h11M11 21h8\"/>\u003c/svg>\u003cspan>\u003cstrong>פענוח דוח\u003c/strong>\u003csmall>דוח מכון · בחינם\u003c/small>\u003c/span>\u003c/button>\u003cbutton class=\"cta consult\" data-screen=\"consult\">\u003csvg viewBox=\"0 0 32 32\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" aria-hidden=\"true\">\u003cpath d=\"M6 5h20v17H15l-7 6v-6H6z\"/>\u003cpath d=\"M11 11h10M11 16h7\"/>\u003c/svg>\u003cspan>\u003cstrong>התייעצות עם הבוחן\u003c/strong>\u003csmall>ייעוץ אישי עם עמוס · 149 ₪\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">←\u003c/span>\u003c/button>\u003c/div>\u003cbutton class=\"more\" data-screen=\"example\">איך נראה פענוח? ←\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"below\">הפקת עבר ביטוחי וייעוץ אישי זמינים בנפרד בתשלום.\u003cp>\u003ca href=\"https://buytest.co.il/articles/\">למאמרים ולמדריכים של עמוס\u003c/a>\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"screen\" id=\"before\" hidden>\u003cbutton class=\"back\" data-screen=\"home\">→ חזרה למסך הפתיחה\u003c/button>\u003ch2>מה חשוב לדעת על הרכב?\u003c/h2>\u003cp>מתחילים במספר הרישוי וממשיכים לנתונים, לתובנות ולשאלות שכדאי לשאול את המוכר.\u003c/p>\u003cp class=\"note\">זו הדגמת העיצוב בלבד. אין כאן שליפת נתונים או שמירת פרטים.\u003c/p>\u003clabel for=\"plate-demo\">מספר הרכב\u003c/label>\u003cinput id=\"plate-demo\" inputmode=\"numeric\" maxlength=\"8\" placeholder=\"לדוגמה: 12345678\">\u003cbutton class=\"cta\" data-screen=\"report\">\u003cstrong>כבר יש דוח מכון? לפענוח ←\u003c/strong>\u003c/button>\u003c/section>\u003csection class=\"screen\" id=\"report\" hidden>\u003cbutton class=\"back\" data-screen=\"home\">→ חזרה למסך הפתיחה\u003c/button>\u003ch2>מבינים את דוח הבדיקה\u003c/h2>\u003cp>פענוח אוטומטי המבוסס על הידע והמאגר המקצועי של עמוס רוקח.\u003c/p>\u003cp class=\"note\">תצוגה מקדימה למסלול המוצע. ההעלאה והפענוח אינם מופעלים כאן, והמחיר באתר הפעיל עדיין לא השתנה.\u003c/p>\u003clabel for=\"report-demo\">בחירת דוח מהמכשיר\u003c/label>\u003cinput id=\"report-demo\" type=\"file\" accept=\"image/*,application/pdf\">\u003cp id=\"file-status\" aria-live=\"polite\">הקובץ לא נשלח לשום שרת.\u003c/p>\u003cbutton class=\"cta navy\" data-screen=\"example\">\u003cstrong>לצפייה בדוגמת הסבר ←\u003c/strong>\u003c/button>\u003cp>לאחר הפענוח: אפשרות לייעוץ אישי עם עמוס — 149 ₪.\u003c/p>\u003c/section>\u003csection class=\"screen\" id=\"example\" hidden>\u003cbutton class=\"back\" data-screen=\"home\">→ חזרה למסך הפתיחה\u003c/button>\u003ch2>מהממצא לשאלה הנכונה\u003c/h2>\u003cp>דוגמה להמחשה בלבד, ללא ניתוח של רכב מסוים.\u003c/p>\u003cdiv class=\"example\">\u003ch3>בדוח: ״רעידות בתיבת ההילוכים״\u003c/h3>\u003cp>\u003cstrong>מה המשמעות?\u003c/strong> זהו ממצא שדורש בירור ממוקד. מהניסוח לבדו אי אפשר לקבוע את מקור הרעידות או את עלות התיקון.\u003c/p>\u003cp>\u003cstrong>מה לברר?\u003c/strong> מתי מופיעות הרעידות, האם קיימת אבחנה מפורטת והאם יש תיעוד לתיקונים קודמים.\u003c/p>\u003c/div>\u003cbutton class=\"cta navy\" data-screen=\"report\">\u003cstrong>בחזרה למסלול הפענוח ←\u003c/strong>\u003c/button>\u003c/section>\u003csection class=\"screen\" id=\"consult\" hidden>\u003cbutton class=\"back\" data-screen=\"home\">→ חזרה למסך הפתיחה\u003c/button>\u003ch2>התייעצות עם הבוחן\u003c/h2>\u003cp class=\"trust\">עמוס רוקח · 15 שנות ניסיון בבדיקות קנייה\u003c/p>\u003cdiv class=\"example\">\u003ch3>עוברים יחד על הדברים שחשוב לברר\u003c/h3>\u003cp>שאלות על דוח הבדיקה, משמעות הממצאים ומה כדאי לבדוק לפני ההחלטה.\u003c/p>\u003cstrong>ייעוץ אישי — 149 ₪\u003c/strong>\u003c/div>\u003cp class=\"note\">מסך הדגמה בלבד. התשלום ותיאום הייעוץ עדיין אינם מחוברים כאן.\u003c/p>\u003cbutton class=\"cta navy\" data-screen=\"report\">\u003cstrong>יש לך דוח? למסלול הפענוח ←\u003c/strong>\u003c/button>\u003c/section>\u003csection class=\"screen\" id=\"vehicle\" hidden>\u003cspan class=\"demo-tag\">נתונים להמחשה בלבד\u003c/span>\u003ch2>מכירים את הרכב\u003c/h2>\u003cp>נתוני הרכב שנמצאו במאגר משרד התחבורה\u003c/p>\u003cdiv class=\"example\">\u003ch3>פרטי הרכב\u003c/h3>\u003cp>דגם · שנת ייצור · סוג בעלות · מועד הטסט\u003c/p>\u003c/div>\u003ch3>מה כדאי לברר בדגם הזה?\u003c/h3>\u003cp>כאן יוצגו תופעות מוכרות, כאשר קיים מידע מקצועי מתאים לדגם.\u003c/p>\u003cbutton class=\"cta\">\u003cstrong>עבר ביטוחי?, עתיד בטוח!\u003c/strong>\u003c/button>\u003cp>הפקה ופענוח עבר ביטוחי — 39 ₪\u003c/p>\u003cbutton class=\"cta navy\">\u003cstrong>ממשיכים לאימות הרישיון ←\u003c/strong>\u003c/button>\u003c/section>\u003csection class=\"screen\" id=\"license\" hidden>\u003cspan class=\"demo-tag\">הדגמת המסך המתוכנן\u003c/span>\u003ch2>מה מספר הרישיון שלכם?\u003c/h2>\u003cp>מצלמים את רישיון הרכב ומשווים את הפרטים למאגר.\u003c/p>\u003cdiv class=\"upload-demo\">▤\u003cbr>\u003cstrong>צילום או העלאת רישיון\u003c/strong>\u003cp>כאן יוצג הרישיון שהעליתם\u003c/p>\u003c/div>\u003cdiv class=\"example\">\u003ch3>השוואה למאגר\u003c/h3>\u003cp>מספר רכב ודגם — בדיקת התאמה\u003c/p>\u003cp>קילומטראז׳ — השוואת הקריאות ותאריכיהן\u003c/p>\u003cp>פרט שלא ניתן לקרוא — בקשת אימות\u003c/p>\u003c/div>\u003cbutton class=\"cta\">\u003cstrong>לשאלות שכדאי לשאול ←\u003c/strong>\u003c/button>\u003c/section>\u003csection class=\"screen\" id=\"questions\" hidden>\u003cspan class=\"demo-tag\">שאלות לדוגמה\u003c/span>\u003ch2>חמש שאלות לפני שמחליטים\u003c/h2>\u003cp>השאלות יותאמו לנתונים ולדוחות הזמינים.\u003c/p>\u003col class=\"questions\">\u003cli>האם יש תיעוד טיפולים מסודר?\u003c/li>\u003cli>האם ידוע לך על תאונות או תיקוני מרכב?\u003c/li>\u003cli>האם קיימות תקלות שטרם תוקנו?\u003c/li>\u003cli>האם הוחלף לוח המחוונים?\u003c/li>\u003cli>האם אפשר לבצע בדיקה במכון שאבחר?\u003c/li>\u003c/ol>\u003cbutton class=\"cta navy\">\u003cstrong>יש דוח בדיקה? ממשיכים לפענוח ←\u003c/strong>\u003c/button>\u003c/section>\u003c/main>\u003cscript>\nfunction showScreen(id){if(!['home','before','vehicle','license','questions','report','example','consult'].includes(id))id='home';for(const el of document.querySelectorAll('main>section'))el.hidden=el.id!==id;window.scrollTo(0,0)}document.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>{location.hash=b.dataset.screen}));window.addEventListener('hashchange',()=>showScreen(location.hash.slice(1)));showScreen(location.hash.slice(1));document.getElementById('report-demo').addEventListener('change',e=>{document.getElementById('file-status').textContent=e.target.files.length?'נבחר קובץ להדגמה בלבד. הוא לא הועלה ולא נשלח.':'הקובץ לא נשלח לשום שרת.'});\n\u003c/script>\u003c/html>\n";const steps=[["home", "שלוש דרכים להכיר את הרכב", 6000], ["before", "מתחילים במספר הרכב", 5000], ["vehicle", "נתוני הרכב ואפשרות לעבר ביטוחי", 6500], ["license", "הרישיון שלכם מול נתוני המאגר", 6500], ["questions", "מגיעים מוכנים לשיחה עם המוכר", 6000], ["report", "כבר יש דוח? מעלים לפענוח בחינם", 6000], ["example", "מבינים את הממצא ומה צריך לברר", 7000], ["consult", "נשארו שאלות? ייעוץ אישי עם עמוס", 6000]];const frame=document.getElementById('frame');let index=0,playing=true,timer,pulseTimer;const progress=document.getElementById('progress');steps.forEach(()=>progress.appendChild(document.createElement('i')));function render(){clearTimeout(timer);clearTimeout(pulseTimer);document.getElementById('cursor').style.display='none';const w=frame.contentWindow;if(!w.showScreen)return;w.showScreen(steps[index][0]);document.getElementById('caption').textContent=steps[index][1];document.getElementById('count').textContent=(index+1)+' / '+steps.length;[...progress.children].forEach((e,i)=>e.classList.toggle('on',i<=index));document.getElementById('play').textContent=playing?'השהיה ❚❚':'המשך ▶';if(steps[index][0]==='before'){w.document.getElementById('plate-demo').value='12345678'}if(playing){pulseTimer=setTimeout(()=>{const doc=w.document,section=doc.getElementById(steps[index][0]),target=section.querySelector('.cta');if(target){target.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>{if(!playing)return;const r=target.getBoundingClientRect(),c=document.getElementById('cursor');c.style.top=(r.top+r.height/2-15)+'px';c.style.left=(r.left+r.width/2-15)+'px';c.style.display='block'},400)}},steps[index][2]-1700);timer=setTimeout(()=>{index=(index+1)%steps.length;render()},steps[index][2])}}frame.onload=render;frame.srcdoc=source;document.getElementById('prev').onclick=()=>{index=(index+steps.length-1)%steps.length;render()};document.getElementById('next').onclick=()=>{index=(index+1)%steps.length;render()};document.getElementById('play').onclick=()=>{playing=!playing;render()};</script></html>
