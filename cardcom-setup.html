<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>הגדרת Cardcom ל-BuyTest</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 18px; background: #f3f7f8; color: #13272e; font-family: Arial, sans-serif; }
    .card { max-width: 520px; margin: 26px auto; padding: 24px; background: #fff; border: 1px solid #d8e4e7; border-radius: 22px; box-shadow: 0 12px 38px #17333d17; }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { margin: 0 0 18px; color: #557079; line-height: 1.6; }
    .field { margin: 13px 0; }
    label { display: block; margin-bottom: 6px; font-weight: 800; }
    input { width: 100%; padding: 13px; border: 1px solid #bdcdd2; border-radius: 12px; background: #fff; color: #13272e; font-size: 17px; }
    .ltr { direction: ltr; text-align: left; }
    .note { padding: 12px; border-radius: 12px; background: #edf8f4; color: #075e48; font-weight: 700; }
    button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 13px; background: #0fa87e; color: #fff; font-size: 18px; font-weight: 900; }
    button:disabled { opacity: .6; }
    .status { min-height: 24px; margin-top: 14px; font-weight: 800; }
    .error { color: #a32727; }
    .success { color: #087356; }
    small { display: block; margin-top: 12px; color: #60717a; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="card">
    <h1>חיבור Cardcom ל-BuyTest</h1>
    <p>הפרטים נשלחים ישירות לכספת המוצפנת של השרת. הם אינם נשמרים בדפדפן ואינם מפעילים חיובים.</p>
    <form id="setup-form">
      <div class="field">
        <label for="terminal">מספר מסוף</label>
        <input class="ltr" id="terminal" inputmode="numeric" value="197356" required>
      </div>
      <div class="field">
        <label for="api-name">API Name</label>
        <input class="ltr" id="api-name" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="api-password">API Password</label>
        <input class="ltr" id="api-password" type="password" autocomplete="new-password" required>
      </div>
      <div class="note">לאחר השמירה התשלום יישאר כבוי עד שאבדוק את החיבור.</div>
      <button id="save" type="submit">שמירה מאובטחת</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <small>זהו קישור חד-פעמי. לאחר שמירה מוצלחת לא ניתן להשתמש בו שוב.</small>
    </form>
  </main>
  <script>
    const endpoint = "https://tjxjxavxrmvbofvtnsaj.supabase.co/functions/v1/buytest-cardcom-setup";
    const token = location.hash.slice(1);
    history.replaceState({}, document.title, location.pathname);
    const form = document.getElementById("setup-form");
    const status = document.getElementById("status");
    const save = document.getElementById("save");

    if (!token) {
      status.textContent = "הקישור חסר או אינו תקף.";
      status.className = "status error";
      save.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      save.disabled = true;
      status.textContent = "שומר בכספת המאובטחת...";
      status.className = "status";
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            setupToken: token,
            terminalNumber: document.getElementById("terminal").value,
            apiName: document.getElementById("api-name").value,
            apiPassword: document.getElementById("api-password").value
          })
        });
        const data = await response.json();
        if (!response.ok || !data.ok) throw new Error(data.error || "save_failed");
        document.getElementById("api-name").value = "";
        document.getElementById("api-password").value = "";
        status.textContent = "הפרטים נשמרו בהצלחה. אפשר לסגור את הדף ולחזור לצ'אט.";
        status.className = "status success";
        form.querySelectorAll("input, button").forEach((element) => { element.disabled = true; });
      } catch (error) {
        status.textContent = error.message === "invalid_setup_link"
          ? "הקישור אינו תקף או שכבר נעשה בו שימוש."
          : "לא ניתן לשמור כרגע. לא בוצע שינוי ולא הופעל חיוב.";
        status.className = "status error";
        save.disabled = false;
      }
    });
  </script>
</body>
</html>
